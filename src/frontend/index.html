<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>SiGMA Event Concierge</title>
<style>
  /* Header / chat / form stacked to fill the screen,
     so the form always sits at the bottom. */
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    font-family: "Segoe UI", Arial, sans-serif;
    color: #1b1420;
    background: #faf8fc;
  }

  /* SiGMA purple header with the red slash from the logo */
  header {
    flex: none;              /* header and composer keep their size... */
    background: #4a1a6e;
    border-bottom: 5px solid #e8332a;
    padding: 16px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
  }

  header img {
    height: 32px;
    background: #fff;      /* the wordmark is black, so it needs a light plate */
    border-radius: 6px;
    padding: 6px 10px;
  }

  header h1 {
    margin: 0;
    font-size: 1.1rem;
    color: #fff;
  }

  /* Chat area takes the leftover space and scrolls on its own */
  #chat {
    flex: 1;                 /* ...the chat gets everything left over */
    overflow-y: auto;
    padding: 24px;
  }

  /* Keeps the bubbles and the input aligned on one 700px column */
  .column {
    max-width: 700px;
    margin: 0 auto;
  }

  .message {
    margin-bottom: 14px;
    padding: 12px 16px;
    border-radius: 10px;
    line-height: 1.5;
    white-space: pre-wrap;    /* keeps the model's line breaks */
  }

  .you {
    background: #4a1a6e;
    color: #fff;
  }

  .concierge {
    background: #fff;
    border: 1px solid #e6e0ec;
  }

  .error {
    background: #fff2f1;
    border: 1px solid #e8332a;
    color: #b3241d;
  }

  /* Input row, pinned to the bottom by the body flex layout */
  #composer {
    flex: none;
    background: #fff;
    border-top: 1px solid #e6e0ec;
    padding: 16px 24px;
  }

  #composer form {
    display: flex;
    gap: 8px;
  }

  input {
    flex: 1;
    font-size: 1rem;
    padding: 12px;
    border: 1px solid #e6e0ec;
    border-radius: 8px;
  }

  button {
    font-size: 1rem;
    padding: 12px 22px;
    border: none;
    border-radius: 8px;
    background: #e8332a;
    color: #fff;
    cursor: pointer;
  }

  button:disabled {
    background: #c9c2d1;
    cursor: not-allowed;
  }
</style>
</head>
<body>

  <header>
    <img src="assets/sigma-logo.webp" alt="SiGMA" />
    <h1>Event Concierge &middot; SiGMA Malta 2026</h1>
  </header>

  <div id="chat">
    <div class="column" id="messages"></div>
  </div>

  <div id="composer">
    <form class="column" id="form">
      <input id="question" placeholder="Ask about a session, speaker or exhibitor..." autocomplete="off" />
      <button id="send" type="submit">Send</button>
    </form>
  </div>

<script>
  var chat = document.getElementById("chat");
  var messages = document.getElementById("messages");
  var form = document.getElementById("form");
  var input = document.getElementById("question");
  var send = document.getElementById("send");

  // Adds one bubble to the chat and returns it, so we can edit it later.
  function addMessage(cssClass, text) {
    var div = document.createElement("div");
    div.className = "message " + cssClass;
    div.textContent = text;
    messages.appendChild(div);
    chat.scrollTop = chat.scrollHeight;   // keep the newest message in view
    return div;
  }

  form.onsubmit = async function (event) {
    event.preventDefault();

    var question = input.value.trim();
    if (!question) return;

    addMessage("you", question);
    input.value = "";
    send.disabled = true;

    // Placeholder bubble while we wait for host.py to answer.
    var reply = addMessage("concierge", "Thinking...");

    try {
      var response = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question: question })
      });

      if (!response.ok) throw new Error("Server returned " + response.status);

      var data = await response.json();
      reply.textContent = data.answer;
    } catch (error) {
      reply.className = "message error";
      reply.textContent = "Could not reach the concierge: " + error.message;
    }

    send.disabled = false;
    input.focus();
  };

  input.focus();
</script>

</body>
</html>
