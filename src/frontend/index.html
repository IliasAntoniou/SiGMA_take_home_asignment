<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>SiGMA Event Concierge</title>
<style>
  /* Header / chat / form stacked to fill the screen,
     so the form always sits at the bottom. */
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    font-family: "Segoe UI", Arial, sans-serif;
    color: #1b1420;
    background: #faf8fc;
  }

  /* SiGMA purple header with the red slash from the logo */
  header {
    flex: none;              /* header and composer keep their size... */
    background: #4a1a6e;
    border-bottom: 5px solid #e8332a;
    padding: 16px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
  }

  header img {
    height: 32px;
    background: #fff;      /* the wordmark is black, so it needs a light plate */
    border-radius: 6px;
    padding: 6px 10px;
  }

  header h1 {
    margin: 0;
    font-size: 1.1rem;
    color: #fff;
  }

  /* Chat area takes the leftover space and scrolls on its own */
  #chat {
    flex: 1;                 /* ...the chat gets everything left over */
    overflow-y: auto;
    padding: 24px;
  }

  /* Keeps the bubbles and the input aligned on one 700px column */
  .column {
    max-width: 700px;
    margin: 0 auto;
  }

  .message {
    margin-bottom: 14px;
    padding: 12px 16px;
    border-radius: 10px;
    line-height: 1.5;
    white-space: pre-wrap;    /* keeps the model's line breaks */
  }

  /* Who said it - the text comes from the data-who attribute set in JS */
  .message::before {
    content: attr(data-who);
    display: block;
    margin-bottom: 6px;
    font-size: 0.78rem;
    font-weight: bold;
    opacity: 0.7;
  }

  .you {
    background: #4a1a6e;
    color: #fff;
  }

  .concierge {
    background: #fff;
    border: 1px solid #e6e0ec;
  }

  /* "Thinking" plus three pulsing dots while the model writes - the spans
     are added in JS and wiped automatically when the answer replaces the
     bubble's content, and the muted italic reverts with the class. */
  .thinking {
    color: #5c5266;
    font-style: italic;
  }

  .thinking span {
    display: inline-block;
    width: 7px;
    height: 7px;
    margin-left: 5px;
    border-radius: 50%;
    background: #4a1a6e;
    opacity: 0.25;
    animation: pulse 1.2s infinite;
  }

  .thinking span:nth-child(2) { animation-delay: 0.2s; }
  .thinking span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes pulse {
    0%, 80%, 100% { opacity: 0.25; transform: translateY(0); }
    40%           { opacity: 1;    transform: translateY(-3px); }
  }

  /* A steady indicator for people who opt out of animation */
  @media (prefers-reduced-motion: reduce) {
    .thinking span { animation: none; opacity: 0.6; }
  }

  .error {
    background: #fff2f1;
    border: 1px solid #e8332a;
    color: #b3241d;
  }

  /* Source chips under an answer - the records the backend verified it cited.
     The bubble is pre-wrap for the model's text; chips wrap normally. */
  .sources {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid #e6e0ec;
    white-space: normal;
  }

  .source {
    font-size: 0.78rem;
    padding: 4px 8px;
    border: 1px solid #e6e0ec;
    border-radius: 6px;
    background: #f1e9f8;
    color: #4a1a6e;
    cursor: help;            /* hover shows the abstract / description */
  }

  /* Model switch, sitting to the left of the question box */
  #providers {
    display: flex;
    gap: 4px;
    background: #f1e9f8;
    border-radius: 8px;
    padding: 4px;
  }

  .provider {
    font-size: 0.85rem;
    padding: 8px 12px;
    border: none;
    border-radius: 6px;
    background: none;
    color: #4a1a6e;
    cursor: pointer;
  }

  /* The model in use gets the SiGMA purple fill */
  .provider.selected {
    background: #4a1a6e;
    color: #fff;
  }

  /* Shown before the first question, removed once the chat starts */
  #empty-state {
    color: #5c5266;
    line-height: 1.6;
  }

  #empty-state h2 {
    margin: 0 0 6px;
    font-size: 1.15rem;
    color: #1b1420;
  }

  #empty-state p {
    margin: 0 0 16px;
  }

  .example {
    display: block;
    width: 100%;
    margin-bottom: 8px;
    padding: 10px 14px;
    font-size: 0.95rem;
    text-align: left;
    color: #4a1a6e;
    background: #fff;
    border: 1px solid #e6e0ec;
    border-radius: 8px;
    cursor: pointer;
  }

  .example:hover {
    border-color: #4a1a6e;
  }

  /* Input row, pinned to the bottom by the body flex layout */
  #composer {
    flex: none;
    background: #fff;
    border-top: 1px solid #e6e0ec;
    padding: 16px 24px;
  }

  #composer form {
    display: flex;
    gap: 8px;
  }

  input {
    flex: 1;
    font-size: 1rem;
    padding: 12px;
    border: 1px solid #e6e0ec;
    border-radius: 8px;
  }

  button {
    font-size: 1rem;
    padding: 12px 22px;
    border: none;
    border-radius: 8px;
    background: #e8332a;
    color: #fff;
    cursor: pointer;
  }

  button:disabled {
    background: #c9c2d1;
    cursor: not-allowed;
  }
</style>
</head>
<body>

  <header>
    <img src="assets/sigma-logo.webp" alt="SiGMA" />
    <h1>Event Concierge &middot; SiGMA Malta 2026</h1>
  </header>

  <div id="chat">
    <div class="column">
      <div id="empty-state">
        <h2>Ask about SiGMA Malta 2026</h2>
        <p>
          I answer from the official programme only - 40 sessions and 20 exhibitors.
          If something isn't in it, I'll say so rather than guess. Try one of these:
        </p>
        <!-- buttons for example questions, they fill the input and submit the form when clicked. -->
        <button class="example" type="button">What AI-related talks are on Wednesday afternoon?</button>
        <button class="example" type="button">Who is speaking about regulation?</button>
        <button class="example" type="button">I'm a payments startup - which exhibitors should I visit?</button>
        <button class="example" type="button">Build me a 1-day agenda focused on emerging tech.</button>
      </div>

      <div id="messages" aria-live="polite"></div>
    </div>
  </div>

  <div id="composer">
    <form class="column" id="form">
      <div id="providers">
        <button class="provider selected" type="button" data-provider="ollama">Ollama</button>
        <button class="provider" type="button" data-provider="gemini">Gemini</button>
      </div>

      <input id="question" placeholder="Ask about a session, speaker or exhibitor..." autocomplete="off" />
      <!-- button that submits the form, disabled while waiting for the answer. -->
      <button id="send" type="submit">Send</button>
    </form>
  </div>

<script>
  var chat = document.getElementById("chat");
  var messages = document.getElementById("messages");
  var emptyState = document.getElementById("empty-state");
  var form = document.getElementById("form");
  var input = document.getElementById("question");
  var send = document.getElementById("send");
  var providers = document.getElementById("providers");

  //variables to control which model answers, and to label the bubble, default to Ollama.
  var provider = "ollama";
  var providerLabel = "Ollama";

  //creates the bubbles used for both the user's questions and the model's answers.
  function addMessage(cssClass, who, text) {
    var div = document.createElement("div");
    div.className = "message " + cssClass;
    div.dataset.who = who;
    div.textContent = text;
    messages.appendChild(div);
    chat.scrollTop = chat.scrollHeight;   // keep the newest message in view
    return div;
  }

  //creates the source chips under an answers for each record the backend verified.
  function addSources(bubble, sources) {
    if (!sources || !sources.length) return;

    var row = document.createElement("div");
    row.className = "sources";

    for (var i = 0; i < sources.length; i++) {
      var s = sources[i];
      var chip = document.createElement("span");
      chip.className = "source";

      //chip content and tooltip creation based on whether the record is a session or an exhibitor.

      if (s.title) {   // session: [S014] Title · Wednesday 13:00 · Main Stage
        chip.textContent = "[" + s.id + "] " + s.title + " · " +
          s.day.split(" ")[0] + " " + s.start + " · " + s.room;
        chip.title = "Speakers: " + s.speakers.join(", ") + "\n\n" + s.abstract;
      } else {         // exhibitor: [E001] Name · Stand A12
        chip.textContent = "[" + s.id + "] " + s.name + " · Stand " + s.stand;
        chip.title = s.category + "\n\n" + s.description;
      }

      row.appendChild(chip);
    }

    bubble.appendChild(row);
  }

  //what happens when the user submits a question.

  form.onsubmit = async function (event) {
    event.preventDefault();

    var question = input.value.trim();
    if (!question) return;

    emptyState.hidden = true;   // first question replaces the intro
    addMessage("you", "👤 You", question);
    input.value = "";
    send.disabled = true;

    // Remember which model was chosen when the question was sent, in case the
    // user flips the switch while waiting for the answer.
    var answeredBy = providerLabel;

    // Placeholder bubble while we wait for the backend to answer: "Thinking"
    // plus three pulsing dots (see .thinking). Setting textContent later
    // removes the whole thing in one go.
    var reply = addMessage("concierge", "🤖 " + answeredBy, "Thinking");
    reply.classList.add("thinking");
    for (var d = 0; d < 3; d++) reply.appendChild(document.createElement("span"));

    //send the question to the orchestrator, which forwards it to the chosen model. the backend returns a JSON object.
    try {
      var response = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question: question, provider: provider })
      });
      //Parse the JSON response from the backend, which contains the answer and any sources.
      var data = await response.json();

      //if the model cannot be reached the orchestrator sends an error message, which we display in a bubble.
      if (!response.ok) throw new Error(data.error || "Server returned " + response.status);

      reply.classList.remove("thinking");
      reply.textContent = data.answer;
      addSources(reply, data.sources);
    } catch (error) {
      reply.className = "message error";
      reply.dataset.who = "⚠ " + answeredBy + " failed";
      reply.textContent = "Could not reach the concierge: " + error.message;
    }

    chat.scrollTop = chat.scrollHeight;   // the answer replaced "Thinking..."
    send.disabled = false;
    input.focus();
  };

  //Clicking the model switch buttons changes the provider variable and updates the button styles to show
  //which is selected.
  providers.onclick = function (event) {
    var clicked = event.target;
    if (!clicked.dataset.provider) return;

    provider = clicked.dataset.provider;
    providerLabel = clicked.textContent;

    var buttons = providers.children;
    for (var i = 0; i < buttons.length; i++) {
      buttons[i].className = buttons[i] === clicked ? "provider selected" : "provider";
    }

    input.focus();
  };

  // Clicking an example question fills the box and sends it.
  emptyState.onclick = function (event) {
    if (event.target.classList.contains("example")) {
      input.value = event.target.textContent;
      form.requestSubmit();
    }
  };

  input.focus();
</script>

</body>
</html>
